# v1 shipped `CI = "false"` here purely to stop Netlify failing the build on
# lint warnings. It is deliberately gone — the build must pass on its own merits.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.12.0"

# Astro fingerprints everything it emits into /_astro/, so it is safe to cache
# forever. Anything else stays revalidated.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
